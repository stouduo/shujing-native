[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/ui-kit", "crates/mcp-server",
        "crates/cli"]

[workspace.dependencies]
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-postgres = "0.7"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "default-rustls"] }
rusqlite = { version = "0.33", features = ["bundled"] }
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }
russh = "0.65"
mongodb = "3"
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], default-features = false }
rust_xlsxwriter = "0.79"
calamine = "0.28"

[profile.release]
strip = true
lto = true
