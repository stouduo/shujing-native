[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/ui-kit", "crates/mcp-server",
        "crates/cli"]
exclude = ["examples/plugins/rows-to-markdown"]

[workspace.dependencies]
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-postgres = "0.7"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "default-rustls"] }
rusqlite = { version = "0.33", features = ["bundled", "column_decltype"] }
parquet = { version = "53", default-features = false, features = ["snap"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }
mongodb = "3"
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
digest = "0.10"
ring = "0.17"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], default-features = false }
rust_xlsxwriter = "0.79"
wasmi = "0.40"
calamine = "0.28"

[profile.release]
strip = true
lto = true
codegen-units = 1
