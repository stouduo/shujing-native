[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = "0.7"
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "default-rustls"] }
rusqlite = { version = "0.33", features = ["bundled"] }
redis = { version = "0.27", features = ["tokio-comp"], default-features = false }

[profile.release]
strip = true
lto = true
