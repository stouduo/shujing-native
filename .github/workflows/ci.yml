name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cmake (rdkafka vendored build)
        run: brew install cmake
      - name: Test (workspace, full features)
        run: cargo test --workspace
      - name: Test lean core (mcp/cli feature set)
        run: cargo check -p shujing-core --no-default-features -p shujing-cli

  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        # librdkafka vendored 构建需要 curl/zlib 头文件
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libcurl4-openssl-dev zlib1g-dev
      - name: Core logic tests + app/ui-kit compile check
        # 渲染测试留 macOS:headless runner 无 GPU(kittest wgpu 起不来),
        # 且 egui 快照断言跨平台像素必有差异;ui-kit 画廊也是渲染测试
        run: |
          cargo test -p shujing-core -p shujing-mcp
          cargo check -p shujing-app -p ui-kit

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --workspace
