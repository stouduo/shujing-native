[package]
name = "shujing-app"
version = "0.13.2"
edition = "2021"
description = "数镜原生版界面(egui/eframe)"

[dependencies]
shujing-core = { path = "../core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "accesskit"] }
egui = "0.31"
ui-kit = { path = "../ui-kit" }
memmap2 = "0.9"
egui_extras = { version = "0.31", default-features = false }
tokio = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rfd = "0.15"

# Linux 桌面必需(winit 在 Linux 无平台 feature 会 compile_error)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[features]
default = ["renderer-glow", "x11"]
# 渲染层双轨:glow(native 默认)/ wgpu(wasm 与 kittest 共用路径)
renderer-glow = ["eframe/glow"]
renderer-wgpu = ["eframe/wgpu"]
x11 = ["eframe/x11"]
wayland = ["eframe/wayland"]

[dev-dependencies]
egui_kittest = { version = "0.31.0", features = ["snapshot", "wgpu", "eframe"] }
