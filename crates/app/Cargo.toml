[package]
name = "shujing-app"
version = "0.9.2"
edition = "2021"
description = "数镜原生版界面(egui/eframe)"

[dependencies]
shujing-core = { path = "../core" }
eframe = { version = "0.31", features = [] }
egui = "0.31"
memmap2 = "0.9"
egui_extras = { version = "0.31", default-features = false }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
objc2 = "0.6"

[features]
default = []

[dev-dependencies]
egui_kittest = { version = "0.31.0", features = ["snapshot", "wgpu"] }
